# Template: the nginx image fills in ${GOLDTERM_TRADES_UPSTREAM} when the container starts.
# Same behaviour as the EC2 server: index.html is never cached; assets carry ?v= stamps.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Forward-test record: a trades.json mounted at /data wins; otherwise it is fetched live from the
    # bot's server (${GOLDTERM_TRADES_UPSTREAM}, set with docker run -e). Rendered by nginx's envsubst at start.
    location = /trades.json {
        root /data;
        default_type application/json;
        add_header Cache-Control "no-store";
        log_not_found off;
        try_files /trades.json @bot;
    }
    location @bot {
        proxy_pass ${GOLDTERM_TRADES_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }
    # Personal files are never in the image; answer 404 without logging noise.
    location ~ ^/(forward/|journal-sync\.) { access_log off; return 404; }
    location / { try_files $uri $uri/ =404; }
}
