# /etc/nginx/default.d/goldterm-v2.conf
# GoldTerm 1.2 and later live in /usr/share/nginx/html-v2 and are served at /v2/. CloudFront reads this path
# (origin path /v2 in deploy/auth-stack.yaml), so https://<cloudfront>/ is the new site while http://<server ip>/
# keeps the earlier version from /usr/share/nginx/html. goldterm-deploy installs releases into html-v2 only.
location = /v2 { return 301 /v2/; }
location /v2/ {
    alias /usr/share/nginx/html-v2/;
    index index.html;
}
location = /v2/index.html {
    alias /usr/share/nginx/html-v2/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
location = /v2/trades.json {
    alias /var/lib/goldterm-public/trades.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}
